<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101a29"><title>GHETTO BEASTS — 3D Mobile Benchmark</title>
<link rel="stylesheet" href="./style.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
</head>
<body>
<main id="app">
  <canvas id="scene" aria-label="3D-Kampfarena"></canvas>
  <header><div class="brand">GHETTO <b>BEASTS</b><small>3D PERFORMANCE LAB · P1</small></div><div class="pill" id="mode">WEBGL TEST</div></header>
  <section id="stats" aria-label="Leistungsmessung">
    <div><strong id="fps">—</strong><span>FPS (1s)</span></div><div><strong id="low">—</strong><span>1% LOW*</span></div><div><strong id="frame">—</strong><span>FRAME ms</span></div><div><strong id="draws">—</strong><span>DRAW CALLS</span></div>
  </section>
  <div class="footer">
    <div class="controls"><button id="toggle" type="button">⏸ Animation pausieren</button><button id="camera" type="button">↻ Kamera wechseln</button></div>
    <label>Render-Skalierung <output id="scale-value">1.0×</output><input id="scale" type="range" min="0.5" max="1.5" step="0.1" value="1"></label>
    <label>Lastprofil <select id="load"><option value="2">2 Figuren</option><option value="6" selected>6 Figuren</option><option value="12">12 Figuren</option><option value="24">24 Figuren</option></select></label>
    <button id="export" type="button">Messbericht kopieren</button>
    <p id="status" role="status">Starte WebGL …</p>
    <p class="note">*1%-Low-Schätzung aus Framezeiten des letzten 30-s-Fensters. Testwerte sind nicht mit nativen Apps gleichzusetzen.</p>
  </div>
</main>
<script type="module" src="./main.js"></script>
</body></html>
