name: Spielbare Vorschau

on:
  push:
    branches:
      - feat/p6-enemies-balance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playable-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Upload playable files
        uses: actions/upload-artifact@v4
        with:
          name: ghetto-beasts-playable
          path: dist/
          if-no-files-found: error
